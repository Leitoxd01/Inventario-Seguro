{% extends 'inventario/base.html' %}
{% block contenido %}
<h1>{{ titulo }}</h1>
<form method="post" novalidate class="card shadow-sm"><div class="card-body">
{% csrf_token %}
{% for campo in formulario %}<div class="mb-3"><label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>{{ campo }}{% for error in campo.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}
{% for error in formulario.non_field_errors %}<div class="alert alert-danger">{{ error }}</div>{% endfor %}
<button type="submit" class="btn btn-primary">Guardar</button> <a href="{% url 'inventario:lista' %}" class="btn btn-secondary">Cancelar</a>
</div></form>
{% endblock %}
